name: Publish the complete Riemann archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Recreate the original Lean files from tracked TXT sources
        run: python3 scripts/restore_lean.py
      - name: Count and fingerprint every source file
        run: python3 scripts/prepare.py
      - name: Build the complete searchable archive
        run: python3 scripts/build_site.py
      - name: Analyze all source dependencies and layer sizes
        run: python3 scripts/analyze_dependencies.py
      - name: Use the explicitly dated local verification snapshot
        run: |
          cp reports/publication-metrics.json dist/data/metrics.json
          cp reports/publication-verification.json dist/data/verification.json
      - name: Build Lean/TXT downloads and standalone verification tools
        run: python3 scripts/build_downloads.py
      - name: Prepare and validate the Pages artifact
        run: |
          python3 scripts/site_pages.py
          python3 scripts/check_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy the complete static website
        id: deployment
        uses: actions/deploy-pages@v4
